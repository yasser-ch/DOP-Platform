server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/xxx est relayé vers l'API Gateway en retirant le préfixe /api
    # (le "/" final de proxy_pass remplace le préfixe de la location).
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toute route inconnue renvoie index.html (application monopage).
    location / {
        try_files $uri /index.html;
    }
}
