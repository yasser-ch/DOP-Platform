# Profil Spring `docker` : routage + rate limiting de la gateway (DODP-14 / DODP-60).
# Active par SPRING_PROFILES_ACTIVE=docker dans docker-compose.yml.
spring:
  cloud:
    gateway:
      # Rate limiting applique a TOUTES les routes : token bucket par IP, stocke dans Redis.
      # Au-dela du seuil la gateway repond HTTP 429 (Too Many Requests).
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
        - id: assujettis
          uri: http://assujettis-service:8082
          predicates:
            - Path=/assujettis/**
          filters:
            - StripPrefix=1
        - id: declaration
          uri: http://declaration-service:8083
          predicates:
            - Path=/declaration/**
          filters:
            - StripPrefix=1
        - id: document
          uri: http://document-service:8084
          predicates:
            - Path=/document/**
          filters:
            - StripPrefix=1
        - id: workflow
          uri: http://workflow-service:8085
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1
        - id: reconciliation
          uri: http://reconciliation-service:8086
          predicates:
            - Path=/reconciliation/**
          filters:
            - StripPrefix=1
        - id: notification
          uri: http://notification-service:8087
          predicates:
            - Path=/notification/**
          filters:
            - StripPrefix=1
        - id: audit
          uri: http://audit-service:8088
          predicates:
            - Path=/audit/**
          filters:
            - StripPrefix=1
        - id: reporting
          uri: http://reporting-service:8089
          predicates:
            - Path=/reporting/**
          filters:
            - StripPrefix=1
        - id: scoring
          uri: http://scoring-service:8090
          predicates:
            - Path=/scoring/**
          filters:
            - StripPrefix=1
