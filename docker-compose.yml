# DODP-14 (S4) + DODP-60 (S60) - Environnement local : `docker compose up --build` lance tout.
# Build : services Java depuis la racine du depot (contexte `.`) ; scoring-service depuis son dossier.
#
#   cp .env.example .env      # definir JWT_SECRET (32 car. min) et le compte admin
#   docker compose up --build
#   curl http://localhost:8080/assujettis/actuator/health   # via la gateway
#
# Exposition : SEULE l'api-gateway publie un port (8080). Les autres services et Redis ne sont
# joignables que par le reseau interne `dop-net` (par nom de service, ex. http://auth-service:8081).
# La gateway applique un rate limiting par IP (Redis) : au-dela du seuil -> HTTP 429.

x-java-service: &java-service
  restart: unless-stopped
  networks: [dop-net]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || wget -qO- http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s

services:
  auth-service:
    <<: *java-service
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: dop/auth-service:local
    container_name: dop-auth
    environment:
      SERVER_PORT: 8081
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant, copier .env.example vers .env}"
      DOP_ADMIN_EMAIL: "${DOP_ADMIN_EMAIL:?DOP_ADMIN_EMAIL manquant, voir .env.example}"
      DOP_ADMIN_PASSWORD: "${DOP_ADMIN_PASSWORD:?DOP_ADMIN_PASSWORD manquant, voir .env.example}"

  assujettis-service:
    <<: *java-service
    build:
      context: .
      dockerfile: assujettis-service/Dockerfile
    image: dop/assujettis-service:local
    container_name: dop-assujettis
    environment:
      SERVER_PORT: 8082
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant, copier .env.example vers .env}"

  declaration-service:
    <<: *java-service
    build:
      context: .
      dockerfile: declaration-service/Dockerfile
    image: dop/declaration-service:local
    container_name: dop-declaration
    environment:
      SERVER_PORT: 8083

  document-service:
    <<: *java-service
    build:
      context: .
      dockerfile: document-service/Dockerfile
    image: dop/document-service:local
    container_name: dop-document
    environment:
      SERVER_PORT: 8084

  workflow-service:
    <<: *java-service
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
    image: dop/workflow-service:local
    container_name: dop-workflow
    environment:
      SERVER_PORT: 8085

  reconciliation-service:
    <<: *java-service
    build:
      context: .
      dockerfile: reconciliation-service/Dockerfile
    image: dop/reconciliation-service:local
    container_name: dop-reconciliation
    environment:
      SERVER_PORT: 8086

  notification-service:
    <<: *java-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: dop/notification-service:local
    container_name: dop-notification
    environment:
      SERVER_PORT: 8087

  audit-service:
    <<: *java-service
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    image: dop/audit-service:local
    container_name: dop-audit
    environment:
      SERVER_PORT: 8088

  reporting-service:
    <<: *java-service
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    image: dop/reporting-service:local
    container_name: dop-reporting
    environment:
      SERVER_PORT: 8089

  scoring-service:
    build:
      context: ./scoring-service
    image: dop/scoring-service:local
    container_name: dop-scoring
    restart: unless-stopped
    networks: [dop-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: dop-redis
    restart: unless-stopped
    networks: [dop-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: dop/api-gateway:local
    container_name: dop-gateway
    restart: unless-stopped
    networks: [dop-net]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      # Rate limiting par IP (requetes/seconde et rafale). Baisser pour tester le 429.
      RATE_LIMIT_REPLENISH_RATE: "${RATE_LIMIT_REPLENISH_RATE:-10}"
      RATE_LIMIT_BURST_CAPACITY: "${RATE_LIMIT_BURST_CAPACITY:-20}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      assujettis-service:
        condition: service_healthy
      declaration-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      reconciliation-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      scoring-service:
        condition: service_healthy
    ports:
      - "8080:8080"

networks:
  dop-net:
    name: dop-net