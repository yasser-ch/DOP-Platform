name: DOP Platform - Secrets Scan

# S52 : aucun secret en clair dans le depot (code, config, historique git).
# Echec du build si gitleaks detecte un secret.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan de tout l'historique, pas seulement le dernier commit

      - name: Run gitleaks
        run: |
          mkdir -p reports/gitleaks
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --redact --verbose \
            --report-format sarif \
            --report-path /repo/reports/gitleaks/gitleaks.sarif \
            --exit-code 1

      - name: Block tracked secret files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.(pem|p12|pfx|jks|keystore)|id_rsa|credentials\.json)$' \
                | grep -Ev '\.(example|sample|template)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Fichiers sensibles versionnes :"
            echo "$bad"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Aucun secret detecte (historique complet scanne)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Secret(s) detecte(s) : voir le log et l'artefact **gitleaks-report** (valeurs masquees)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: reports/gitleaks
          if-no-files-found: ignore
          retention-days: 14
