name: DOP Platform - Secrets Scan

# S52 : aucun secret en clair dans le depot (code, config, historique git).
# Echec du build si gitleaks detecte un secret.

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan de tout l'historique, pas seulement le dernier commit

      # Binaire officiel epingle + checksum. Evite "dubious ownership" de git quand
      # gitleaks tourne dans un conteneur Docker sur un checkout appartenant a un autre user.
      - name: Install gitleaks
        run: |
          VER=8.21.2
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -fsSLO "${BASE}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSLO "${BASE}/gitleaks_${VER}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${VER}_checksums.txt"
          sudo tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          mkdir -p reports/gitleaks
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact --verbose \
            --report-format sarif \
            --report-path reports/gitleaks/gitleaks.sarif \
            --exit-code 1

      - name: Block tracked secret files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.(pem|p12|pfx|jks|keystore)|id_rsa|credentials\.json)$' \
                | grep -Ev '\.(example|sample|template)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Fichiers sensibles versionnes :"
            echo "$bad"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Aucun secret detecte (historique complet scanne)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Secret(s) detecte(s) : voir le log et l'artefact **gitleaks-report** (valeurs masquees)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: reports/gitleaks
          if-no-files-found: ignore
          retention-days: 14
