name: DOP Platform - Security SCA

# S50 / NF-06 : scan des dependances (OWASP Dependency-Check) et des images
# de conteneurs (Trivy) a chaque build. Echec au-dela du seuil defini.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # lundi 03:00 UTC : nouvelles CVE sur du code inchange

permissions:
  contents: read

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Seuil d'echec. Trivy : severites bloquantes (separees par des virgules).
  TRIVY_FAIL_SEVERITY: 'CRITICAL'
  # Dependency-Check : score CVSS minimum qui fait echouer (9.0 = CRITICAL).
  DC_FAIL_CVSS: '9'

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile sans tests pour que Dependency-Check voie les dependances Maven
      # resolues (les tests sont deja executes par ci.yml).
      - name: Resolve Maven dependencies
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dc-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: ${{ github.repository }}
          path: '.'
          format: 'HTML,JSON'
          out: 'reports/dependency-check'
          args: >
            --failOnCVSS ${{ env.DC_FAIL_CVSS }}
            --suppression .github/dependency-check-suppressions.xml
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --data /github/home/.dependency-check-data
            --enableRetired
            --disableAssembly

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## OWASP Dependency-Check"
            echo "Seuil d'echec : CVSS >= ${DC_FAIL_CVSS}"
            echo "Le rapport HTML complet est dans l'artefact **dependency-check-report**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/dependency-check
          if-no-files-found: warn
          retention-days: 14

  trivy-fs:
    name: Trivy - dependances (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.58.1

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Passe 1 : rapport complet (toutes severites), ne fait jamais echouer.
      - name: Trivy report (all severities)
        run: |
          mkdir -p reports/trivy
          trivy fs . --scanners vuln --ignore-unfixed \
            --format table --output reports/trivy/fs-report.txt --exit-code 0
          trivy fs . --scanners vuln --ignore-unfixed \
            --format json --output reports/trivy/fs-report.json --exit-code 0
          {
            echo "## Trivy - dependances (fs)"
            echo '```'
            head -c 60000 reports/trivy/fs-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Passe 2 : gate. Echec si une vulnerabilite >= seuil.
      - name: Trivy gate
        run: |
          trivy fs . --scanners vuln --ignore-unfixed \
            --severity "$TRIVY_FAIL_SEVERITY" --exit-code 1

      - name: Upload Trivy fs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: reports/trivy
          if-no-files-found: warn
          retention-days: 14

  trivy-image:
    name: Trivy - images de conteneurs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.58.1

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Decouvre automatiquement tous les Dockerfile du depot, construit chaque
      # image puis la scanne. Rien a maintenir quand un service est ajoute.
      - name: Build and scan every Dockerfile
        run: |
          set -uo pipefail
          mkdir -p reports/trivy
          status=0
          found=0
          while IFS= read -r dockerfile; do
            found=1
            dir=$(dirname "$dockerfile")
            name=$(echo "$dir" | sed 's#^\./##; s#[^A-Za-z0-9]#-#g'); name=${name:-root}
            image="dop-local/${name}:ci"
            echo "::group::Build ${image} (${dockerfile})"
            docker build -f "$dockerfile" -t "$image" "$dir" || { status=1; echo "::endgroup::"; continue; }
            echo "::endgroup::"

            echo "::group::Scan ${image}"
            trivy image "$image" --ignore-unfixed --scanners vuln \
              --format table --output "reports/trivy/image-${name}.txt" --exit-code 0
            trivy image "$image" --ignore-unfixed --scanners vuln \
              --format json --output "reports/trivy/image-${name}.json" --exit-code 0
            {
              echo "## Trivy - image ${name}"
              echo '```'
              head -c 30000 "reports/trivy/image-${name}.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            trivy image "$image" --ignore-unfixed --scanners vuln \
              --severity "$TRIVY_FAIL_SEVERITY" --exit-code 1 || status=1
            echo "::endgroup::"
          done < <(find . -name 'Dockerfile*' -not -path '*/node_modules/*' -not -path './.git/*')

          if [ "$found" -eq 0 ]; then
            echo "Aucun Dockerfile trouve : rien a scanner." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload Trivy image reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-reports
          path: reports/trivy
          if-no-files-found: ignore
          retention-days: 14
